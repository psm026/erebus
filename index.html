<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PSM — EREBUS · dark, beautiful fantasies</title>
  <meta name="description" content="PSM's EREBUS — a living dark world of rooms, portals and hidden things. It grows while you're away. Take the dive." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#030307" />
  <meta property="og:title" content="PSM — EREBUS · dark, beautiful fantasies" />
  <meta property="og:description" content="A living dark world. It grows while you're away. Take the dive." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="script.js?v=15"></script>
  <script>
    // rescue hatch: if the module/CDN never loads, don't strand visitors on the loader
    setTimeout(function () {
      if (!window.__erebusBooted) document.body.classList.add('no-webgl', 'world-ready');
    }, 6000);
  </script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <!-- The screening room: a film takes the page when a burning ring is opened -->
  <div id="cinema" aria-hidden="true">
    <video id="cinemaFilm" playsinline preload="metadata"></video>
    <div class="cin-head">
      <p class="cin-eyebrow"></p>
      <h2 class="cin-title"></h2>
    </div>
    <div class="cin-ui">
      <button class="cin-mute" type="button">● sound</button>
      <button class="cin-exit" type="button">◦ surface</button>
    </div>
  </div>

  <!-- The listening room: Spotify deck in wood-dark chrome -->
  <div id="listen" aria-hidden="true">
    <div class="lst-panel">
      <p class="lst-eyebrow"></p>
      <h2 class="lst-title"></h2>
      <iframe title="The listening deck" src="about:blank" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      <button class="lst-exit" type="button">◦ surface</button>
    </div>
  </div>

  <!-- The first link: entry film. Plays once per session, then the world. -->
  <div id="entry" hidden>
    <video id="entryFilm" playsinline preload="auto" muted></video>
    <div class="entry-ui">
      <button id="entrySound" type="button">◦ sound</button>
      <button id="entrySkip" type="button">enter →</button>
    </div>
  </div>
  <script>
    (function () {
      var entry = document.getElementById('entry');
      var film = document.getElementById('entryFilm');
      // 4K from the CDN for big sharp screens; 1080 from the repo for everyone else
      var HD = 'first-link-web.mp4';
      var UHD = 'https://b2ojikys9vmljtf7.public.blob.vercel-storage.com/FIRST-LINK-web-4K.mp4';
      var wants4k = !matchMedia('(pointer: coarse)').matches
        && (screen.width * (window.devicePixelRatio || 1)) >= 2200
        && !(navigator.connection && navigator.connection.saveData);
      film.src = wants4k ? UHD : HD;
      var seen = false;
      try { seen = !!sessionStorage.getItem('erebus.entered'); } catch (e) {}
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (seen || location.hash || reduced) { entry.remove(); return; }
      entry.hidden = false;
      document.body.classList.add('entry-active');
      function leave() {
        if (!entry.parentNode) return;
        try { sessionStorage.setItem('erebus.entered', '1'); } catch (e) {}
        entry.classList.add('gone');
        document.body.classList.remove('entry-active');
        setTimeout(function () { entry.remove(); }, 1600);
      }
      film.addEventListener('ended', leave);
      film.addEventListener('error', function () {
        // if the 4K stream fails for any reason, fall back to 1080 before giving up
        if (film.src === UHD) {
          film.src = HD;
          var pr = film.play();
          if (pr && pr.catch) pr.catch(function () { leave(); });
        } else leave();
      });
      document.getElementById('entrySkip').addEventListener('click', leave);
      var snd = document.getElementById('entrySound');
      snd.addEventListener('click', function () {
        film.muted = !film.muted;
        snd.textContent = film.muted ? '◦ sound' : '● sound';
      });
      var started = false;
      film.addEventListener('playing', function () { started = true; });
      setTimeout(function () { if (!started) leave(); }, 8000);
      var p = film.play();
      if (p && p.catch) p.catch(function () { leave(); });
    })();
  </script>

  <!-- The world -->
  <canvas id="erebus" aria-hidden="true"></canvas>

  <!-- Loader -->
  <div id="loader" role="status" aria-live="polite">
    <div class="loader-inner">
      <span class="loader-label">Descending into Erebus</span>
      <span class="loader-count" id="loader-count">000</span>
    </div>
  </div>

  <!-- HUD -->
  <header class="hud">
    <div class="hud-left">
      <span class="hud-mono">PSM</span>
      <span class="hud-sub">Dark, beautiful fantasies</span>
    </div>
    <div class="hud-right">
      <span id="hud-sector">EREBUS // DRIFT</span>
      <span id="hud-time">00:00</span>
    </div>
  </header>

  <div class="hud-bottom">
    <span id="hud-index"></span>
    <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
    <span class="hud-hint" id="hud-hint">Scroll to drift</span>
  </div>

  <!-- The way back out of a dive room -->
  <button id="hud-exit" type="button">◦ surface</button>

  <!-- Panels are built by script.js from world.json — the world is data -->
  <main id="content"></main>

  <!-- Hidden-thing overlay (easter eggs) -->
  <div id="egg-veil" role="dialog" aria-modal="true" aria-label="Hidden discovery">
    <div class="egg-card">
      <p class="eyebrow egg-eyebrow"></p>
      <h2 class="egg-title"></h2>
      <p class="p-desc egg-body"></p>
      <button class="p-link egg-close" type="button">Return to the dark</button>
    </div>
  </div>

  <!-- Invisible scroll runway; height is set by script.js -->
  <div id="scroll-space" aria-hidden="true"></div>

  <noscript>
    <style>
      #loader, #erebus { display: none; }
      .panel { position: static !important; opacity: 1 !important; transform: none !important; margin: 18vh 7vw; }
      #scroll-space { display: none; }
    </style>
    <p style="position:fixed;bottom:1rem;left:1rem;font-size:12px;opacity:.6">This site renders Erebus in real time with JavaScript — showing the plain version.</p>
  </noscript>
</body>
</html>
